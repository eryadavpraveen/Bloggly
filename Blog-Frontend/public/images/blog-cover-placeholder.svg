<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none" role="img" aria-label="Bloggly cover placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F4F5"/>
      <stop offset="1" stop-color="#E4E4E7"/>
    </linearGradient>
    <linearGradient id="panel" x1="360" y1="160" x2="920" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#FAFAFA" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#18181B" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <circle cx="180" cy="120" r="90" fill="#D4D4D8" fill-opacity="0.45"/>
  <circle cx="1140" cy="620" r="140" fill="#A1A1AA" fill-opacity="0.18"/>
  <circle cx="1040" cy="140" r="60" fill="#D4D4D8" fill-opacity="0.35"/>

  <rect
    x="340"
    y="150"
    width="600"
    height="420"
    rx="32"
    fill="url(#panel)"
    stroke="#D4D4D8"
    stroke-width="1.5"
    filter="url(#softShadow)"
  />

  <!-- subtle top accent line -->
  <rect x="520" y="250" width="240" height="3" rx="1.5" fill="#D4D4D8"/>

  <text
    x="640"
    y="360"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="Geist, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="96"
    font-weight="700"
    letter-spacing="-0.05em"
    fill="#18181B"
  >Bloggly</text>

  <!-- subtle bottom accent line -->
  <rect x="560" y="420" width="160" height="3" rx="1.5" fill="#A1A1AA"/>

  <!-- soft content hints like previous premium card -->
  <rect x="460" y="470" width="360" height="10" rx="5" fill="#E4E4E7"/>
  <rect x="500" y="498" width="280" height="10" rx="5" fill="#E4E4E7"/>
</svg>
